name: Verify Odin Primes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release file set
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {
              ".dockerignore", ".gitignore", "Dockerfile", "LICENSE", "README.md",
              ".github/workflows/verify.yml", "index.html", "results.json",
              "wheel.html", "wheel30.html", "local.html", "local-i9-12900h.json", "local-xeon-w-1350p.json", "wheel210-reported.json", "base-intel12900h.json",
              "wheel210/Dockerfile", "wheel210/README.md",
              "wheel210/main.odin", "wheel210/tests.odin",
              "wheel30/Dockerfile", "wheel30/README.md", "wheel30/main.odin",
              "tools/ci_report.py", "tools/test_ci_report.py",
              "tools/wheel_ci_report.py", "tools/test_wheel_ci_report.py",
              "tools/wheel30_ci_report.py", "tools/test_wheel30_ci_report.py",
              "tools/test_base_intel_report.py",
              "src/main.odin", "src/tests.odin",
              "src/get_num_cores_linux.odin", "src/get_num_cores_windows.odin",
          }
          tracked = set(subprocess.check_output(["git", "ls-files"], text=True).splitlines())
          if tracked != allowed:
              raise SystemExit(f"Unexpected release file set: {sorted(tracked ^ allowed)}")
          print("Release file set verified.")
          PY
      - name: Validate CI report parser
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Validate separate reported wheel track
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('wheel210-reported.json').read_text())
          assert d['schema_version']==1 and d['status']=='reported'
          assert d['track']=='wheel-210' and d['limit']==1000000
          assert d['compiler'].startswith('Odin dev-2026-10')
          assert len(d['lanes'])==2
          assert {x['mode'] for x in d['lanes']}=={'single','multi'}
          assert all(x['passes']>0 and x['seconds']>=5 for x in d['lanes'])
          assert 'Developer-provided' in d['evidence'] and 'pending' in d['evidence']
          print('Wheel track is correctly labeled as reported, not CI-verified.')
          PY
      - name: Validate Xeon local summary and machine separation
        run: |
          python3 - <<'PY'
          import json
          import math
          import statistics
          from pathlib import Path

          xeon=json.loads(Path("local-xeon-w-1350p.json").read_text())
          i9=json.loads(Path("local-i9-12900h.json").read_text())
          assert xeon["machine_id"]=="xeon-w-1350p"
          assert xeon["source"]=="local-machine" and xeon["audit"]["status"]=="PASS"
          assert xeon["host"]["logical_processors"]==12
          assert xeon["provenance"]["git_commit"]==i9["provenance"]["git_commit"]
          assert xeon["provenance"]["source_sha256"]==i9["provenance"]["source_sha256"]
          assert xeon["measurements"]["multi"]["status"]=="unavailable"
          assert xeon["measurements"]["multi"]["blocks"]==0
          assert xeon["measurements"]["multi"]["samples"]==[]
          assert i9["measurements"]["multi"]["workers"]==20
          for field,workers,blocks in [("single",1,6),("optional_multi12",12,7)]:
              group=xeon["measurements"][field]
              assert group["workers"]==workers and group["blocks"]==blocks
              assert len(group["samples"])==blocks
              for track in ("base","wheel30","wheel210"):
                  throughput=[b["values"][track]["passes_per_second"] for b in group["samples"]]
                  assert math.isclose(statistics.median(throughput), group["tracks"][track]["median"],rel_tol=1e-9)
                  assert all(v>0 and math.isfinite(v) for v in throughput)
              ratios=[b["values"]["wheel30"]["passes_per_second"]/b["values"]["wheel210"]["passes_per_second"] for b in group["samples"]]
              pair=group["pairs"]["wheel30/wheel210"]
              assert math.isclose(statistics.median(ratios),pair["median_ratio"],rel_tol=1e-9)
              assert pair["wins"]==sum(x>1 for x in ratios)
          assert xeon["correctness"]["primes_at_one_million"]==78498
          print("Xeon publication record PASS: 1/12 workers, 20-worker lane unavailable.")
          PY
      - name: Build pinned Odin compiler and benchmark
        run: docker build --target build -t odin-primes:build .
      - name: Verify Base compiler release
        run: test "$(docker run --rm odin-primes:build odin version)" = "odin version dev-2026-10-nightly:84bc3fc"
      - name: Run correctness regression tests
        run: docker run --rm odin-primes:build sh -lc 'odin test .'
      - name: Build runtime image
        run: docker build -t odin-primes .
      - name: Smoke test official benchmark output
        run: |
          docker run --rm odin-primes > "$RUNNER_TEMP/odin-primes-output.txt"
          python3 - <<'PY'
          import math
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"], "odin-primes-output.txt").read_text()
          labels = {
              "odin_bit_moe": ("bits=1", 1),
              "odin_byte_moe": ("bits=8", 1),
              "odin_bit_threaded_moe": ("bits=1", None),
              "odin_byte_threaded_moe": ("bits=8", None),
          }
          rows = {}
          for line in output.splitlines():
              parts = line.strip().split(";")
              if len(parts) != 5 or parts[0] not in labels:
                  continue
              name, passes, seconds, threads, tags = parts
              expected_bits, expected_threads = labels[name]
              passes, seconds, threads = int(passes), float(seconds), int(threads)
              assert name not in rows, f"Duplicate result: {name}"
              assert passes > 0 and 5 <= seconds < 60 and math.isfinite(seconds)
              assert threads >= 1 and (expected_threads is None or threads == expected_threads)
              assert set(tags.split(",")) == {
                  "algorithm=base", "faithful=yes", expected_bits
              }, line
              rows[name] = (passes, seconds, threads)
          assert set(rows) == set(labels), f"Missing benchmark results: {set(labels) - set(rows)}"
          print("Four benchmark lanes passed their protocol checks.")
          for name, (passes, seconds, threads) in rows.items():
              print(f"{name}: {passes/seconds:.1f} passes/s, workers={threads}")
          PY
      - name: Generate Pages evidence
        run: |
          mkdir -p "$RUNNER_TEMP/odin-pages"
          cp index.html "$RUNNER_TEMP/odin-pages/index.html"
          touch "$RUNNER_TEMP/odin-pages/.nojekyll"
          python3 tools/ci_report.py --input "$RUNNER_TEMP/odin-primes-output.txt" --output "$RUNNER_TEMP/odin-pages/results.json"
      - name: Preserve public CI measurement artifact
        uses: actions/upload-artifact@v4
        with:
          name: odin-ci-results-${{ github.run_id }}
          path: ${{ runner.temp }}/odin-pages/results.json
          retention-days: 90
          if-no-files-found: error

  wheel210:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build checksum-pinned October Odin and Wheel-210
        run: docker build --target build -t odin-wheel210:build wheel210
      - name: Verify independent wheel oracle
        run: docker run --rm odin-wheel210:build sh -lc 'odin test . -define:ODIN_TEST_THREADS=1'
      - name: Record wheel compiler version
        run: docker run --rm odin-wheel210:build odin version > "$RUNNER_TEMP/wheel-version.txt"
      - name: Build wheel runtime
        run: docker build -t odin-wheel210 wheel210
      - name: Measure wheel five-second single and parallel lanes
        run: docker run --rm odin-wheel210 > "$RUNNER_TEMP/wheel-output.txt"
      - name: Generate validated wheel CI JSON with host metadata
        run: |
          python3 tools/wheel_ci_report.py --input "$RUNNER_TEMP/wheel-output.txt" --version-file "$RUNNER_TEMP/wheel-version.txt" --output "$RUNNER_TEMP/wheel-pages/wheel210-ci.json"
      - name: Upload Wheel-210 public CI record
        uses: actions/upload-artifact@v4
        with:
          name: wheel210-ci-${{ github.run_id }}
          path: ${{ runner.temp }}/wheel-pages/wheel210-ci.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload Wheel-210 raw output
        uses: actions/upload-artifact@v4
        with:
          name: wheel210-raw-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wheel-output.txt
            ${{ runner.temp }}/wheel-version.txt
          if-no-files-found: error
          retention-days: 90

  wheel30:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build checksum-pinned Odin and Wheel-30 source
        run: docker build --target build -t wheel30:build wheel30
      - name: Compare prime membership against independent oracle at four limits
        run: |
          set -euo pipefail
          for limit in 100 10000 1000000 10000000; do
            docker run --rm -e TEST_LIMIT="$limit" wheel30:build sh -ec '
              odin build main.odin -file -o:speed -microarch:native -no-bounds-check \
                -define:CHECK=true -define:RUN_SECONDS=0 -define:LIMIT="$TEST_LIMIT" -out:check-primes
              ./check-primes 2>&1 | tee /tmp/check-output.txt
              grep -q "CHECK: 0 mismatches" /tmp/check-output.txt
              grep -q "Valid: true" /tmp/check-output.txt
            '
          done
      - name: Record checksum-pinned Odin version
        run: docker run --rm wheel30:build odin version > "$RUNNER_TEMP/wheel30-version.txt"
      - name: Build Wheel-30 runtime
        run: docker build -t wheel30:runtime wheel30
      - name: Measure full five-second single-thread sieve
        run: docker run --rm wheel30:runtime > "$RUNNER_TEMP/wheel30-output.txt" 2> "$RUNNER_TEMP/wheel30-stderr.txt"
      - name: Generate validated Wheel-30 runner metadata
        run: python3 tools/wheel30_ci_report.py --input "$RUNNER_TEMP/wheel30-output.txt" --version-file "$RUNNER_TEMP/wheel30-version.txt" --output "$RUNNER_TEMP/wheel30-pages/wheel30-ci.json"
      - name: Upload Wheel-30 CI record
        uses: actions/upload-artifact@v4
        with:
          name: wheel30-ci-${{ github.run_id }}
          path: ${{ runner.temp }}/wheel30-pages/wheel30-ci.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve Wheel-30 raw output
        uses: actions/upload-artifact@v4
        with:
          name: wheel30-raw-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wheel30-output.txt
            ${{ runner.temp }}/wheel30-stderr.txt
            ${{ runner.temp }}/wheel30-version.txt
          if-no-files-found: error
          retention-days: 90

  pages:
    if: github.event_name != 'pull_request'
    needs: [correctness, wheel210, wheel30]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download verified site artifact
        uses: actions/download-artifact@v4
        with:
          name: odin-ci-results-${{ github.run_id }}
          path: site
      - name: Download verified Wheel-210 CI JSON
        uses: actions/download-artifact@v4
        with:
          name: wheel210-ci-${{ github.run_id }}
          path: site
      - name: Download verified Wheel-30 result
        uses: actions/download-artifact@v4
        with:
          name: wheel30-ci-${{ github.run_id }}
          path: site
      - name: Assemble static site
        run: |
          cp index.html wheel.html wheel30.html local.html local-i9-12900h.json local-xeon-w-1350p.json site/
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
